<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道歉生產器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-body">
                <h1 class="text-center mb-4">道歉生產器</h1>
                
                <div class="form-group mb-3">
                    <label for="name" class="form-label">你的名字</label>
                    <input type="text" class="form-control" id="name" placeholder="請輸入你的名字">
                </div>

                <div class="form-group mb-3">
                    <label for="reason" class="form-label">原因</label>
                    <input type="text" class="form-control" id="reason" placeholder="請輸入原因（例如：粗心、疏忽）">
                </div>

                <div class="form-group mb-3">
                    <label for="incident" class="form-label">事件描述</label>
                    <input type="text" class="form-control" id="incident" placeholder="請輸入發生了什麼事">
                </div>

                <div class="form-group mb-3">
                    <label class="form-label">道歉程度</label>
                    <select class="form-select" id="level">
                        <option value="light">小吵小鬧型道歉</option>
                        <option value="medium">傷心難過型道歉</option>
                        <option value="heavy">痛徹心扉型道歉</option>
                        <option value="extreme">生離死別型道歉</option>
                    </select>
                </div>

                <div class="text-center mb-4">
                    <button id="generateBtn" class="btn btn-primary">生成道歉文</button>
                    <button id="copyBtn" class="btn btn-success ms-2" style="display: none;">複製文字</button>
                </div>

                <div class="result-container">
                    <div id="result" class="result p-3 rounded" style="display: none;"></div>
                    <div id="wordCount" class="text-end mt-2 text-muted" style="display: none;">
                        字數：<span id="wordCountNumber">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
